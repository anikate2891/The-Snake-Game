<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eater Snake</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="/img/snake_favIcon.png" type="image/x-icon">
</head>
<body>
    <main>
        <section>
            <div class="infos">
                <div class="info">
                    <h3>High-Score: <span id="high-score">0</span></h3>
                </div>
                <div class="info">
                    <h3>Score: <span id="score">0</span></h3>
                </div>
                <div class="info">
                    <h3>Time: <span id="time">00:00</span></h3>
                </div>
            </div>
            <div class="board"></div>
        </section>
        <div class="modal">
            <div class="start-game">
                <h3 class="data">Welcome to the Snake Game</h3>
                <button class="btn btn-start">START</button>
            </div>
            <div class="game-over">
                <h3 class="data" >Game Over</h3>
                <button class="btn btn-restart">Restart Game</button>
            </div>
        </div>
    </main>


    <script src="script.js"></script>
</body>
</html>
